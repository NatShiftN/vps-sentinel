[package]
name = "vps-sentinel"
version = "0.1.0"
description = "VPS//SENTINEL — cyberpunk VPS monitor & SSH console"
authors = ["VPS//SENTINEL"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ssh2 = "0.9"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
keyring = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
portable-pty = "0.8"
